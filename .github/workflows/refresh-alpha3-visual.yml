name: Refresh reviewed alpha.3 screenshot references
on:
  push:
    branches: [website-alpha3-release-sync]
    paths: ['.github/workflows/refresh-alpha3-visual.yml']
permissions:
  actions: read
  contents: write
jobs:
  refresh:
    if: github.repository == 'scarp-lang/scarp-lang.github.io' && github.ref == 'refs/heads/website-alpha3-release-sync' && github.event.head_commit.message == 'Stage exact reviewed alpha.3 visual references'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-alpha3-release-sync
      - name: Verify parent and download the exact reviewed capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "37dff856f9031e5da5027ce928461c92755c2027"
          mkdir -p "$RUNNER_TEMP/alpha3-review"
          gh run download 46016208125 --repo scarp-lang/scarp-lang.github.io --name browser-visual-review --dir "$RUNNER_TEMP/alpha3-review"
          cd "$RUNNER_TEMP/alpha3-review"
          sha256sum -c <<'HASHES'
          59ffe7cbfd443a00bb4fa27df85d9294eb7cbcf4eaebe3f85a26f638b29e631d  home-desktop-light.png
          745be334d428c73e85839a3dd27e778353c701693b98aef656f21b48b54f40bd  home-mobile-dark.png
          b0e8f44bf842cb1e341e9c8b350d76ad8992abd014d312728a3535161a8c1099  search-mobile-light.png
          aa137f21abe266bd89c50b02d494e6bbfe0686d389fe81a482c551b342b5aa0a  support-desktop-dark.png
          HASHES
      - name: Commit only the three reviewed screenshots
        run: |
          set -euo pipefail
          root=tests/browser/baselines
          cmp "$RUNNER_TEMP/alpha3-review/support-desktop-dark.png" "$root/support-desktop-dark.png"
          for file in home-desktop-light.png home-mobile-dark.png search-mobile-light.png; do
            cp "$RUNNER_TEMP/alpha3-review/$file" "$root/$file"
            git add -- "$root/$file"
          done
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh three independently reviewed alpha.3 visual baselines'
          git push origin HEAD:refs/heads/website-alpha3-release-sync
