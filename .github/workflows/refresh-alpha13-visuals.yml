name: Review-approved alpha.13 baseline refresh (one-shot)
on:
  push:
    branches: ['feat/alpha13-website-compatibility-20261117']
    paths:
      - '.github/workflows/refresh-alpha13-visuals.yml'
permissions:
  contents: write
jobs:
  refresh-reviewed-baselines:
    if: github.ref == 'refs/heads/feat/alpha13-website-compatibility-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install pinned browser test runtime
        run: npm install --no-save --package-lock=false playwright-core@1.64.1
      - name: Check browser TypeScript
        run: npx tsc -p tsconfig.browser.json
      - name: Build website
        run: npm run build
      - name: Capture reviewed alpha.13 visual baselines and run browser assertions
        env:
          SCARP_UPDATE_VISUAL_BASELINES: '1'
        run: npm run test:browser
      - name: Commit refreshed references to this feature branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/alpha13-website-compatibility-20261117'
          for name in home-desktop-light home-mobile-dark search-mobile-light support-desktop-dark; do
            test -s "tests/browser/baselines/$name.png"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/baselines/home-desktop-light.png tests/browser/baselines/home-mobile-dark.png tests/browser/baselines/search-mobile-light.png tests/browser/baselines/support-desktop-dark.png
          if ! git diff --cached --quiet; then
            git commit -m "test(browser): approve alpha.13 release-content visual baselines"
            git push origin HEAD:feat/alpha13-website-compatibility-20261117
          fi
