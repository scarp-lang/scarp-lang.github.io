name: Temporary alpha.17 reviewed visual baseline import
on:
  push:
    branches: ['feat/alpha17-compiler-evidence-20261121']
permissions:
  contents: write
jobs:
  import-reviewed-pngs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright-core@1.64.1
      - run: npm run build
      - name: Reproduce previously reviewed light and dark screenshots
        run: npm run test:browser
        env:
          SCARP_UPDATE_VISUAL_BASELINES: "1"
      - name: Verify exact reviewed SHA-256 hashes
        shell: bash
        run: |
          printf '%s  %s\n' \
            1196fa9057a9aea9b3817cefded50d419c3d7e89f7edcfbe7b63dcb21c507342 tests/browser/baselines/home-desktop-light.png \
            f64d37704fccaa7f32b368f1f79524a7059598ca1f2cafcdb15450f12a00da51 tests/browser/baselines/home-mobile-dark.png \
            f756da4100c7e7bd99048ee1caf4144243f6dca55be2221c27df4b8ec215c3d9 tests/browser/baselines/search-mobile-light.png \
            aa137f21abe266bd89c50b02d494e6bbfe0686d389fe81a482c551b342b5aa0a tests/browser/baselines/support-desktop-dark.png | sha256sum --check
      - name: Import exact reviewed screenshots and delete temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/baselines/home-desktop-light.png tests/browser/baselines/home-mobile-dark.png tests/browser/baselines/search-mobile-light.png tests/browser/baselines/support-desktop-dark.png
          git rm .github/workflows/temp-alpha17-baselines.yml
          git commit -m "test(browser): import double-reviewed alpha.17 visual baselines"
          git push origin HEAD:feat/alpha17-compiler-evidence-20261121
