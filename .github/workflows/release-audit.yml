name: Audit published Scarp release

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: read

jobs:
  audit-release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit public release, tag and published archive digests
        run: npm run audit:release
        env:
          GITHUB_TOKEN: ${{ github.token }}
