name: Browser accessibility and mobile QA
on:
  push:
    branches: [main, development, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install website dependencies
        run: npm ci
      - name: Install pinned browser test runtime (no lockfile changes)
        run: npm install --no-save --package-lock=false playwright-core@1.64.1
      - name: Check browser test TypeScript
        run: npx tsc -p tsconfig.browser.json
      - name: Build static website
        run: npm run build
      - name: Test mobile and accessibility behavior in Chrome
        run: npm run test:browser
      - name: Upload visual comparison diffs and failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-failures
          path: test-results/browser/
          if-no-files-found: ignore
      - name: Upload light/dark visual review snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-visual-review
          path: test-results/browser/visual/
          if-no-files-found: ignore
          retention-days: 14
