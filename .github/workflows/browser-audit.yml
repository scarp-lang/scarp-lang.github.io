name: Browser accessibility and mobile QA
on:
  push:
    branches: [main, development, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install website dependencies
        run: npm ci
      - name: Install pinned browser test runtime (no lockfile changes)
        run: npm install --no-save --package-lock=false playwright-core@1.64.1
      - name: Check browser test TypeScript
        run: npx tsc -p tsconfig.browser.json
      - name: Build static website
        run: npm run build
      - name: Test mobile and accessibility behavior in Chrome
        run: npm run test:browser
      - name: Upload visual comparison diffs and failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-failures
          path: test-results/browser/
          if-no-files-found: ignore
      - name: Upload light/dark visual review snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-visual-review
          path: test-results/browser/visual/
          if-no-files-found: ignore
          retention-days: 14

  # One-time PR branch visual baseline update after maintainer review of all 4 captures.
  # Never runs on default branch, external PRs, or unrelated refs.
  baseline-refresh:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/verified-alpha12-website-sync-20261116' && github.repository == 'scarp-lang/scarp-lang.github.io' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright-core@1.64.1
      - run: npm run build
      - name: Re-render all four reviewed full-page baselines
        env:
          SCARP_UPDATE_VISUAL_BASELINES: "1"
        run: npm run test:browser
      - name: Push only reviewed screenshot baselines to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/baselines/home-desktop-light.png tests/browser/baselines/home-mobile-dark.png tests/browser/baselines/search-mobile-light.png tests/browser/baselines/support-desktop-dark.png
          if git diff --cached --quiet; then
            echo "No visual baseline changes"
            exit 0
          fi
          git commit -m "test(browser): update reviewed alpha.12 visual baselines"
          git push origin HEAD:refs/heads/feat/verified-alpha12-website-sync-20261116
