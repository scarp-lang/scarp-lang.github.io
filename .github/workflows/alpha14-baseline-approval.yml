name: One-time alpha.14 reviewed browser baselines

on:
  push:
    branches: ['feat/website-alpha14-sync']

permissions:
  contents: write
  actions: read

jobs:
  import-reviewed-screenshots:
    if: github.repository == 'scarp-lang/scarp-lang.github.io' && github.ref == 'refs/heads/feat/website-alpha14-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify the exact source workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="$(gh api repos/scarp-lang/scarp-lang.github.io/actions/runs/44324037820 --jq '.head_sha')"
          test "$source_sha" = 'a4c29b1354420e854b5883ea62653caa21e83c37'
          status="$(gh api repos/scarp-lang/scarp-lang.github.io/actions/artifacts/14436366364 --jq '.name')"
          test "$status" = 'browser-visual-review'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44324037820
          name: browser-visual-review
          github-token: ${{ github.token }}
          path: .reviewed-alpha14
      - name: Import individually reviewed PNG snapshots and remove temporary workflow
        run: |
          set -euo pipefail
          for name in home-desktop-light home-mobile-dark search-mobile-light support-desktop-dark; do
            test -s ".reviewed-alpha14/${name}.png"
            file --mime-type ".reviewed-alpha14/${name}.png" | grep -F 'image/png'
            cp ".reviewed-alpha14/${name}.png" "tests/browser/baselines/${name}.png"
          done
          git add -- tests/browser/baselines
          git rm -- .github/workflows/alpha14-baseline-approval.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(browser): refresh visually reviewed alpha.14 baseline screenshots'
          git push origin 'HEAD:refs/heads/feat/website-alpha14-sync'
