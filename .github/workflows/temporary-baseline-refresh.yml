name: Refresh reviewed alpha.5 visual baselines (temporary)
on:
  push:
    branches:
      - feat/compiler-alpha5-website-20261109
permissions:
  contents: write
jobs:
  refresh-reviewed-screenshots:
    if: github.repository == 'scarp-lang/scarp-lang.github.io' && github.ref == 'refs/heads/feat/compiler-alpha5-website-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compiler-alpha5-website-20261109
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright-core@1.64.1
      - run: npx tsc -p tsconfig.browser.json
      - run: npm run build
      - name: Regenerate the four visually reviewed screenshots
        run: npm run test:browser
        env:
          SCARP_UPDATE_VISUAL_BASELINES: "1"
      - name: Push reviewed screenshot references to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/baselines/*.png
          if git diff --cached --quiet; then
            echo "No baseline changes"
          else
            git commit -m "test: update reviewed alpha.5 desktop and mobile baseline screenshots"
            git push origin HEAD:refs/heads/feat/compiler-alpha5-website-20261109
          fi
