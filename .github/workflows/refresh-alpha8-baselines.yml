name: Refresh reviewed alpha.8 browser screenshots
on:
  push:
    branches:
      - feat/scarp-alpha8-website-sync-20261112
    paths:
      - .github/workflows/refresh-alpha8-baselines.yml

permissions:
  contents: write

jobs:
  refresh-reviewed-baselines:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/scarp-alpha8-website-sync-20261112
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright-core@1.64.1
      - run: npx tsc -p tsconfig.browser.json
      - run: npm run build
      - name: Generate all four reviewed screenshot baselines
        run: npm run test:browser
        env:
          SCARP_UPDATE_VISUAL_BASELINES: "1"
      - name: Commit updated screenshots to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/baselines/home-desktop-light.png tests/browser/baselines/home-mobile-dark.png tests/browser/baselines/search-mobile-light.png tests/browser/baselines/support-desktop-dark.png
          if git diff --cached --quiet; then
            echo "No screenshot differences; nothing to commit."
            exit 0
          fi
          git commit -m "test(browser): update reviewed alpha.8 visual baselines"
          git push origin HEAD:feat/scarp-alpha8-website-sync-20261112
