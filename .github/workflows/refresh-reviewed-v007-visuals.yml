# One-time, reviewed baseline refresh. This file is removed by the refresh commit.
name: Refresh reviewed v0.0.7-alpha.1 visuals
on:
  push:
    branches: [release/website-alpha20-snapshot]
permissions:
  contents: read
  actions: read
jobs:
  refresh:
    if: github.event.head_commit.message == 'chore(visuals): apply reviewed v0.0.7-alpha.1 captures' && github.repository == 'scarp-lang/scarp-lang.github.io'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/website-alpha20-snapshot
      - name: Verify branch has not moved
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: browser-visual-review
          run-id: 45643537277
          github-token: ${{ github.token }}
          path: reviewed
      - name: Verify exact reviewed captures
        run: |
          set -eu
          cd reviewed
          sha256sum --check --strict <<'HASHES'
          7e7060fdcf1d3f739b724645b7850155fb6865955e4531f306ec730651b82f10  home-desktop-light.png
          58c5033bfbe7f8be1149b4bee517cf55885bf14b532463ded772f1e581b2db7f  home-mobile-dark.png
          3e6ccfe52af3b25d29f232a1ff766e32902af47b40e150462829ab3540b496cc  search-mobile-light.png
          aa137f21abe266bd89c50b02d494e6bbfe0686d389fe81a482c551b342b5aa0a  support-desktop-dark.png
          HASHES
          cd ..
          cmp reviewed/support-desktop-dark.png tests/browser/baselines/support-desktop-dark.png
          for name in home-desktop-light home-mobile-dark search-mobile-light; do
            cp "reviewed/$name.png" "tests/browser/baselines/$name.png"
            git add "tests/browser/baselines/$name.png"
          done
          git rm .github/workflows/refresh-reviewed-v007-visuals.yml
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(visuals): refresh three reviewed release baselines"
          git push origin HEAD:refs/heads/release/website-alpha20-snapshot
