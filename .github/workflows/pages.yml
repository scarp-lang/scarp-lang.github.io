name: Deploy official website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-website-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/checkout@v4
        with:
          repository: scarp-lang/scarp
          ref: afe8b5380c9d6c4774162e51c6c9bc8b90901671
          path: .compiler
          persist-credentials: false
      - run: cargo build --manifest-path .compiler/Cargo.toml --locked --offline
      - run: npm run test:examples
        env:
          SCARP_BIN: .compiler/target/debug/scarp
      - name: Check out published Scarp source
        uses: actions/checkout@v4
        with:
          repository: scarp-lang/scarp
          ref: b1c1fd232b418267d95520c69ee563ac99ecae30
          path: .compiler-published
          persist-credentials: false
      - name: Build published interpreter
        run: cargo build --manifest-path .compiler-published/Cargo.toml --locked --offline
      - name: Test the website examples under reviewed published release
        run: npm run test:examples
        env:
          SCARP_BIN: .compiler-published/target/debug/scarp
          SCARP_EXAMPLE_TARGET: published
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # v4+ otherwise excludes .nojekyll and other leading-dot files.
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Check out website smoke-test source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js for smoke testing
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Verify deployed commit and public pages
        run: node --experimental-strip-types scripts/verify-deployment.ts
